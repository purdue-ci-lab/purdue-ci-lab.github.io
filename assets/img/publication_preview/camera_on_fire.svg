<style>
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.4s ease-in-out infinite alternate; }
  .ember { animation: rise 2.6s linear infinite; }
  @keyframes flicker {
    0% { transform: scale(1, 1) skewX(0deg); }
    35% { transform: scale(0.96, 1.07) skewX(-2deg); }
    70% { transform: scale(1.03, 0.94) skewX(2deg); }
    100% { transform: scale(0.98, 1.04) skewX(-1deg); }
  }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-70px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .flame, .ember { animation: none; } }
</style>
