# -----------------------------------------------------------------------------
# Websites for publication authors. In the publication listings, an author whose
# name matches an entry here links to its `url`.
#
# Matching: same last name, and the same first name or first initial. So
# `name: David Lindell` matches "David B. Lindell", "David Lindell" and
# "D. B. Lindell" in _bibliography/papers.bib. Middle names are ignored.
# For a multi-word last name, add `last:` (e.g. `last: van Gogh`).
#
# Lab members (_data/members.yml) already link to their `homepage`; add them
# here only to use a different link.
# -----------------------------------------------------------------------------

# - name: Vincent van Gogh
#   last: van Gogh
#   url: https://example.com/

